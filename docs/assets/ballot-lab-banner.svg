<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="590" viewBox="0 0 1600 590" role="img" aria-labelledby="title description">
  <title id="title">Midnight Ballot Lab — Encrypted votes. Shared results.</title>
  <desc id="description">Built with Midnight. A dark violet illustration shows a ballot becoming encrypted, with three trustee shares beneath it. This research prototype has a native local browser experience and a separate development network client.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151528"/><stop offset="0.6" stop-color="#0a0a10"/><stop offset="1" stop-color="#171732"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#23233c"/><stop offset="1" stop-color="#14141f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7777ff" stop-opacity="0.22"/><stop offset="1" stop-color="#7777ff" stop-opacity="0"/></radialGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#a8a8ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="person" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cy="-10" r="10"/><path d="M-19 22v-5a19 19 0 0 1 38 0v5"/></g>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #f5f5ff; }
      .muted { fill: #b8b8cd; } .violet { fill: #b0b0ff; }
      .label { font-size: 14px; letter-spacing: 2px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1600" height="590" rx="28" fill="url(#background)"/>
  <ellipse cx="1150" cy="260" rx="440" ry="350" fill="url(#glow)"/>
  <path d="M0 558H1600M824 0V590" stroke="#a0a0ff" stroke-opacity="0.08"/>
  <g fill="#b0b0ff" transform="translate(72 61)"><rect width="8" height="29" rx="3"/><rect x="15" y="-8" width="8" height="37" rx="3"/><rect x="30" y="-16" width="8" height="45" rx="3"/></g>
  <text x="130" y="81" class="label violet">MIDNIGHT · VOTING RESEARCH</text>
  <text x="72" y="178" font-size="58" font-weight="650" letter-spacing="-2">Midnight Ballot Lab</text>
  <text x="72" y="266" font-size="49" font-weight="500" letter-spacing="-1.4">Encrypted votes.</text>
  <text x="72" y="326" font-size="49" font-weight="500" letter-spacing="-1.4" class="violet">Shared results.</text>
  <text x="75" y="377" class="muted" font-size="20">Native cryptography. Clickable ballots.</text>
  <text x="75" y="408" class="muted" font-size="20">Receipts to keep. Two trustees to tally.</text>
  <rect x="72" y="454" width="242" height="48" rx="24" fill="#26264b" stroke="#7070b0"/>
  <circle cx="99" cy="478" r="5" fill="#b0b0ff"/>
  <text x="117" y="484" font-size="17" font-weight="600">Built with Midnight</text>
  <text x="336" y="484" class="muted" font-size="17">Compact + browser WASM</text>
  <text x="75" y="544" class="muted" font-size="14">Research prototype · local native experience + development network client</text>

  <rect x="868" y="56" width="660" height="478" rx="28" fill="url(#card)" stroke="#454562"/>
  <text x="902" y="99" class="label violet">ONE CHOICE. ENCRYPTED.</text>
  <rect x="914" y="148" width="126" height="150" rx="17" fill="#1a1a2a" stroke="#74749b"/>
  <path d="M944 176h66M944 190h45" stroke="#a4a4c4" stroke-width="4" stroke-linecap="round"/>
  <rect x="943" y="212" width="18" height="18" rx="4" fill="#aaaaff"/>
  <path d="m948 220 4 4 6-8" fill="none" stroke="#141425" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M974 221h34M944 250h64M944 268h48" stroke="#737399" stroke-width="4" stroke-linecap="round"/>
  <path d="M1055 226h55" fill="none" stroke="#a8a8ff" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="1184" cy="224" r="61" fill="#29294d" stroke="#a0a0f5" stroke-width="2"/>
  <path d="M1165 218v-15a19 19 0 0 1 38 0v15" fill="none" stroke="#d1d1ff" stroke-width="5" stroke-linecap="round"/>
  <rect x="1156" y="215" width="56" height="43" rx="9" fill="#b0b0ff"/>
  <circle cx="1184" cy="233" r="4" fill="#242440"/>
  <path d="M1184 236v8" stroke="#242440" stroke-width="3" stroke-linecap="round"/>
  <path d="M1258 226h48" fill="none" stroke="#a8a8ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1320" y="174" width="160" height="104" rx="17" fill="#1b1b2c" stroke="#606088"/>
  <g fill="#b0b0ff"><rect x="1345" y="208" width="20" height="42" rx="4"/><rect x="1384" y="227" width="20" height="23" rx="4"/><rect x="1423" y="208" width="20" height="42" rx="4"/></g>
  <text x="977" y="327" font-size="16" text-anchor="middle" class="muted">Your ballot</text>
  <text x="1184" y="327" font-size="16" text-anchor="middle" class="muted">Native encryption</text>
  <text x="1400" y="327" font-size="16" text-anchor="middle" class="muted">Aggregate tally</text>
  <path d="M936 357h524" stroke="#484867"/>
  <g color="#b0b0ff"><circle cx="1000" cy="422" r="38" fill="#25253f" stroke="#7777ad"/><use href="#person" transform="translate(1000 420)"/></g>
  <g color="#b0b0ff"><circle cx="1184" cy="422" r="38" fill="#25253f" stroke="#7777ad"/><use href="#person" transform="translate(1184 420)"/></g>
  <g color="#b0b0ff"><circle cx="1368" cy="422" r="38" fill="#25253f" stroke="#7777ad"/><use href="#person" transform="translate(1368 420)"/></g>
  <text x="1000" y="488" text-anchor="middle" font-size="16" class="muted">Trustee 1</text>
  <text x="1184" y="488" text-anchor="middle" font-size="16" class="muted">Trustee 2</text>
  <text x="1368" y="488" text-anchor="middle" font-size="16" class="muted">Trustee 3</text>
</svg>
