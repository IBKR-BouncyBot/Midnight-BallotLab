<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
<title id="title">Any two trustees reveal the combined tally</title>
<desc id="description">Trustees one and three combine contributions with the encrypted aggregate to reveal illustrative totals of two, one and two. Any pair works. Actual contract execution checks registered shares; a copied public export only supports consistency. Centralized key setup and colluding trustees remain trust limits.</desc>
<style>text{font-family:Outfit,'Segoe UI',Arial,sans-serif;fill:#fff}.muted{fill:#b8b8bd}.label{font-size:15px;letter-spacing:2px}.body{font-size:20px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#fff" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="640" fill="#09090b"/>
<rect x="64" y="43" width="15" height="15" fill="#0000fe"/>
<text x="94" y="57" class="label">MIDNIGHT BALLOT LAB / TWO-OF-THREE</text>
<text x="64" y="125" font-size="48" font-weight="600" letter-spacing="-1">Any two trustees. One combined result.</text>
<text x="66" y="166" class="body muted">Example: trustees 1 + 3. The contract also accepts 1 + 2 or 2 + 3.</text>
<g><rect x="64" y="218" width="150" height="181" fill="#0000fe"/><rect x="232" y="218" width="150" height="181" fill="#101013" stroke="#45454d"/><rect x="400" y="218" width="150" height="181" fill="#0000fe"/></g>
<g font-size="56" font-weight="600" text-anchor="middle"><text x="139" y="300">1</text><text x="307" y="300" class="muted">2</text><text x="475" y="300">3</text></g>
<g font-size="19" text-anchor="middle"><text x="139" y="345">Selected</text><text x="307" y="345" class="muted">Not selected</text><text x="475" y="345">Selected</text></g>
<path d="M573 308H613" fill="none" stroke="#fff" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="637" y="218" width="396" height="181" fill="#101013" stroke="#73737b"/>
<text x="835" y="269" font-size="25" font-weight="600" text-anchor="middle">Full encrypted aggregate</text>
<text x="835" y="312" class="body" text-anchor="middle">+ two trustee contributions</text>
<path d="M663 334H1007" stroke="#36363c"/>
<text x="835" y="370" class="body muted" text-anchor="middle">Native contract equations</text>
<path d="M1057 308H1097" fill="none" stroke="#fff" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1121" y="218" width="415" height="181" fill="#101013" stroke="#73737b"/>
<text x="1147" y="259" font-size="25" font-weight="600">Combined tally</text>
<g fill="#0000fe"><rect x="1148" y="292" width="35" height="67"/><rect x="1202" y="326" width="35" height="33"/><rect x="1256" y="292" width="35" height="67"/></g>
<path d="M1147 361H1292" stroke="#73737b"/>
<text x="1411" y="329" font-size="34" font-weight="600" text-anchor="middle">[2, 1, 2]</text>
<text x="1411" y="368" font-size="17" class="muted" text-anchor="middle">5 example ballots</text>
<path d="M64 440H1536" stroke="#73737b"/>
<text x="64" y="479" class="label">TRUST AND VERIFICATION LIMITS</text>
<text x="64" y="519" class="body muted">The local dealer knows every secret share. Two trustees can decrypt individual ballots outside the app.</text>
<text x="64" y="556" class="body muted">A fresh-session import checks public consistency; it cannot authenticate missing ballot or share proofs.</text>
<text x="64" y="603" class="body muted">Automatic local reveal uses synthetic shares in one session. It does not create independent trustee custody.</text>
</svg>
