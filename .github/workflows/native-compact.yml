name: Midnight contract compatibility

# Separate from Pages: this is a compiler/emulator check, not a deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact:
    name: Compile pinned Compact source and run emulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Python packaging checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install and verify the pinned native toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci-install-midnight.sh 2>&1 | tee "$RUNNER_TEMP/toolchain.log"
      - name: Install the reviewed dependency lockfile
        working-directory: contracts
        run: |
          npm ci --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/dependency-install.log"
          npm ls --all --json > "$RUNNER_TEMP/dependency-tree.json"
      - name: Check installed wallet and provider APIs
        run: node --test contracts/test/browser-providers-api.test.mjs contracts/test/native-wasm-plugin.test.mjs contracts/test/browser-prover-startup.test.mjs 2>&1 | tee "$RUNNER_TEMP/provider-api-tests.log"
      - name: Test native adapters, receipts and input boundaries
        run: npm test 2>&1 | tee "$RUNNER_TEMP/native-boundary-tests.log"
      - name: Compile the native encrypted election
        working-directory: contracts
        shell: bash
        run: npm run compile:native 2>&1 | tee "$RUNNER_TEMP/native-election-compile.log"
      - name: Run native encrypted election emulator tests
        working-directory: contracts
        shell: bash
        run: npm run test:native 2>&1 | tee "$RUNNER_TEMP/native-election-tests.log"
      - name: Check actual Ledger callback failure diagnostics
        # Requires the freshly compiled contract and keys; no proof is generated.
        run: node --test contracts/test/browser-prover-failure.test.mjs 2>&1 | tee "$RUNNER_TEMP/browser-prover-failure-tests.log"
      - name: Install isolated devnet wallet dependency graph
        working-directory: contracts/devnet
        run: |
          npm ci --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/devnet-dependency-install.log"
          npm ls --all --json > "$RUNNER_TEMP/devnet-dependency-tree.json"
      - name: Check generated runtime against isolated wallet graph
        # Byte-identical generated/source files, not network or wallet execution.
        working-directory: contracts/devnet
        run: npm run test:runtime 2>&1 | tee "$RUNNER_TEMP/devnet-runtime-tests.log"
      - name: Run generated native election example
        working-directory: contracts
        shell: bash
        run: npm run demo:native 2>&1 | tee "$RUNNER_TEMP/native-election-demo.log"
      - name: Start pinned loopback proof server
        run: |
          docker run --detach --rm --name midnight-ballot-proof-server \
            --publish 127.0.0.1:6300:6300 \
            --env NUM_WORKERS=1 --env NO_FETCH_PARAMS=true \
            --env MIDNIGHT_PROOF_SERVER_NUM_WORKERS=1 \
            --env MIDNIGHT_PROOF_SERVER_NO_FETCH_PARAMS=true \
            midnightntwrk/proof-server@sha256:0f4ab0716985eaebbe55a970348f52ff05ffd8a96631ed7232bd0c4ba02c115c
          node --input-type=module <<'NODE'
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch('http://127.0.0.1:6300/ready', { signal: AbortSignal.timeout(1000) });
              if (response.ok && (await response.json()).status === 'ok') { ready = true; break; }
            } catch { /* Startup has no private inputs; only readiness is checked. */ }
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) throw new Error('Local proof server did not become ready');
          NODE
      - name: Generate real local circuit proofs
        # Synthetic witnesses stay in process memory and loopback requests.
        # Never collect verbose prover logs or request/response bodies.
        run: node contracts/native/prove-local.mjs 2>&1 | tee "$RUNNER_TEMP/local-proofs.log"
      - name: Stop local proof server
        if: always()
        run: |
          if docker container inspect midnight-ballot-proof-server >/dev/null 2>&1; then
            docker stop midnight-ballot-proof-server
          fi
      - name: Build static pages
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/static-build.log"
      - name: Bundle actual native browser runtime and WASM
        shell: bash
        run: npm --prefix contracts run build:browser:native 2>&1 | tee "$RUNNER_TEMP/native-browser-build.log"
      - name: Bundle the Midnight.js network client
        run: node scripts/build-network-browser.mjs 2>&1 | tee "$RUNNER_TEMP/network-browser-build.log"
      - name: Check native static output
        run: |
          node --input-type=module -e 'import fs from "node:fs"; if (JSON.parse(fs.readFileSync("dist/native-build.json", "utf8")).enabled !== true) throw new Error("Native browser build is required");'
          python3 scripts/check_pages.py 2>&1 | tee "$RUNNER_TEMP/pages-packaging.log"
      - name: Install real Chromium for browser acceptance
        run: node contracts/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise native WASM election in real Chromium
        run: node scripts/test-native-browser.mjs 2>&1 | tee "$RUNNER_TEMP/native-browser-tests.log"
      - name: Exercise network client initialization and fail-closed controls
        run: node scripts/test-network-browser.mjs 2>&1 | tee "$RUNNER_TEMP/network-browser-tests.log"
      - name: Prove native circuits and a bound SDK transaction in a real browser worker
        timeout-minutes: 55
        # The earlier loopback HTTP proof server is already stopped. This
        # independent gate allows only public static files from its test site.
        run: |
          node scripts/build-browser-proof-check.mjs 2>&1 | tee "$RUNNER_TEMP/browser-proof-build.log"
          node scripts/test-browser-wasm-proofs.mjs 2>&1 | tee "$RUNNER_TEMP/browser-proof-tests.log"
      - name: Preserve native browser site
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-static-site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiler evidence and dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-check-evidence
          path: |
            contracts/package-lock.json
            contracts/devnet/package-lock.json
            contracts/toolchain.json
            ${{ runner.temp }}/toolchain.log
            ${{ runner.temp }}/dependency-install.log
            ${{ runner.temp }}/dependency-tree.json
            ${{ runner.temp }}/provider-api-tests.log
            ${{ runner.temp }}/devnet-dependency-install.log
            ${{ runner.temp }}/devnet-dependency-tree.json
            ${{ runner.temp }}/devnet-runtime-tests.log
            ${{ runner.temp }}/native-boundary-tests.log
            ${{ runner.temp }}/native-election-compile.log
            ${{ runner.temp }}/native-election-tests.log
            ${{ runner.temp }}/browser-prover-failure-tests.log
            ${{ runner.temp }}/native-election-demo.log
            ${{ runner.temp }}/local-proofs.log
            ${{ runner.temp }}/native-browser-build.log
            ${{ runner.temp }}/network-browser-build.log
            ${{ runner.temp }}/native-browser-tests.log
            ${{ runner.temp }}/network-browser-tests.log
            ${{ runner.temp }}/browser-proof-build.log
            ${{ runner.temp }}/browser-proof-tests.log
            ${{ runner.temp }}/static-build.log
            ${{ runner.temp }}/pages-packaging.log
            artifacts/native-emulator-public.json
            artifacts/native-proof-evidence.json
            artifacts/native-browser/
            artifacts/network-browser/
            artifacts/browser-wasm-proofs/
            dist/native-build.json
            dist/network-build.json
          if-no-files-found: error
          retention-days: 30
